<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        const age=35;
        if(age>=0&&age<=100){
            if(age>=60){
                console.log("Senior");}
           else if(age>=18){
                console.log("Adult");}
            else if(age>=13){
                console.log("Teenager");}
            else{
                console.log("Child");
           } 
        }
        else{
            console.log("Invalid age");
        }
    </script>
</body>
